<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Em Có Yêu Anh Hog</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #06010a; }
        
        .scene {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }
        .scene.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        .scene-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        #start-overlay {
            position: fixed;
            inset: 0;
            background: #06010a;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Dancing Script', cursive;
            transition: opacity 1s;
        }
        #start-overlay h1 {
            font-size: 3rem;
            color: #ff6fae;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #ff3d84;
            text-align: center;
            padding: 0 20px;
        }
        #start-btn {
            padding: 1rem 3rem;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ff6fae, #ff3d84);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px #ff3d84;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 600;
            transition: transform 0.2s;
        }
        #start-btn:hover { transform: scale(1.05); }

        /* === CSS CHO MÀN HÌNH CHẠY CHỮ (MÀN 3) === */
        #scene3 {
            background: radial-gradient(circle at center, #1b0422 0%, #06010a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .lyric-container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            position: relative;
            height: 200px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lyric-line {
            position: absolute;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 111, 174, 0.8), 0 0 30px rgba(255, 61, 132, 0.5);
            line-height: 1.4;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
            pointer-events: none;
        }
        .lyric-line.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .lyric-line.fade-out {
            opacity: 0;
            transform: scale(1.1) translateY(-20px);
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>Em Có Yêu Anh Hog</h1>
        <button id="start-btn">Dạ Có</button>
    </div>

    <!-- === HỆ THỐNG ÂM THANH === -->
    <audio id="music-1" preload="auto">
        <source src="https://raw.githubusercontent.com/hhhh22022010-ops/Tdung/main/AhaTik_nh%E1%BA%A1c%20n%E1%BB%81n%20-%20Sky%20M-TP%20L%C3%A0o%20Cai_31803c0e-d65e-4a36-b24e-65de8cc94e27.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="music-2" preload="auto">
        <source src="https://raw.githubusercontent.com/hhhh22022010-ops/Tdung/main/AhaTik_%C3%A2m%20thanh%20g%E1%BB%91c%20-%20La%20Ph%C6%B0%E1%BB%9Bc%20To%C3%A0n_7c88356c-1591-42d6-b3d3-e736b2c2d96e.mp3" type="audio/mpeg">
    </audio>

    <audio id="music-3" preload="auto" loop>
        <source src="https://raw.githubusercontent.com/hhhh22022010-ops/Tdung/main/6d712d76eccc595aa786c2d3d49b094f.mp3" type="audio/mpeg">
    </audio>

    <!-- MÀN 1: Bắn cung -->
    <div id="scene1" class="scene">
        <iframe id="iframe-bow" class="scene-iframe" srcdoc="
            <!DOCTYPE html>
            <html lang='vi'>
            <head>
                <meta charset='UTF-8'>
                <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
                <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
                    body { overflow: hidden; background: radial-gradient(circle at center, #1b0422 0%, #06010a 100%); }
                    #canvas-container { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
                </style>
            </head>
            <body>
                <div id='canvas-container'></div>
                <script>
                    const container = document.getElementById('canvas-container');
                    const scene = new THREE.Scene();
                    scene.fog = new THREE.FogExp2(0x0e0214, 0.015);
                    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
                    camera.position.set(0, 0, 26);
                    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    container.appendChild(renderer.domElement);

                    const ambientLight = new THREE.AmbientLight(0xfff0f5, 0.9); scene.add(ambientLight);
                    const mainDirLight = new THREE.DirectionalLight(0xffebee, 1.5); mainDirLight.position.set(6, 12, 10); scene.add(mainDirLight);
                    const heartLight = new THREE.PointLight(0xff1493, 3, 16); scene.add(heartLight);

                    function createHeartGeometry(scale) {
                        const shape = new THREE.Shape(); const s = scale;
                        shape.moveTo(0, 0.4 * s);
                        shape.bezierCurveTo(0, 0.7 * s, -0.4 * s, 1.0 * s, -0.8 * s, 1.0 * s);
                        shape.bezierCurveTo(-1.3 * s, 1.0 * s, -1.3 * s, 0.4 * s, -1.3 * s, 0.4 * s);
                        shape.bezierCurveTo(-1.3 * s, -0.1 * s, -0.7 * s, -0.6 * s, 0, -1.2 * s);
                        shape.bezierCurveTo(0.7 * s, -0.6 * s, 1.3 * s, -0.1 * s, 1.3 * s, 0.4 * s);
                        shape.bezierCurveTo(1.3 * s, 0.4 * s, 1.3 * s, 1.0 * s, 0.8 * s, 1.0 * s);
                        shape.bezierCurveTo(0.4 * s, 1.0 * s, 0, 0.7 * s, 0, 0.4 * s);
                        return new THREE.ExtrudeGeometry(shape, { depth: 0.5 * s, bevelEnabled: true, bevelSegments: 5, steps: 2, bevelSize: 0.16 * s, bevelThickness: 0.2 * s });
                    }
                    const heartGeo = createHeartGeometry(1.15); heartGeo.center();
                    const heartMat = new THREE.MeshPhysicalMaterial({ color: 0xff0044, emissive: 0x4a0018, roughness: 0.15, metalness: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.1 });
                    const heart = new THREE.Mesh(heartGeo, heartMat);
                    const heartPos = new THREE.Vector3(2.5, 5.5, 0); heart.position.copy(heartPos); scene.add(heart); heartLight.position.copy(heartPos);

                    const ring1Geo = new THREE.TorusGeometry(2.1, 0.035, 16, 80); const ringMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                    const ring1 = new THREE.Mesh(ring1Geo, ringMat); ring1.position.copy(heartPos); scene.add(ring1);
                    const ring2Geo = new THREE.TorusGeometry(2.4, 0.025, 16, 80); const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 0.6 });
                    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat); ring2.position.copy(heartPos); scene.add(ring2);

                    function createArrowMesh() {
                        const group = new THREE.Group();
                        const shaftGeo = new THREE.CylinderGeometry(0.035, 0.035, 2.6, 8); shaftGeo.rotateZ(-Math.PI / 2); shaftGeo.translate(1.3, 0, 0);
                        const shaftMat = new THREE.MeshStandardMaterial({ color: 0xf5deb3, metalness: 0.2, roughness: 0.5 }); const shaft = new THREE.Mesh(shaftGeo, shaftMat); group.add(shaft);
                        const headGeo = new THREE.ConeGeometry(0.13, 0.45, 10); headGeo.rotateZ(-Math.PI / 2); headGeo.translate(2.6 + 0.225, 0, 0);
                        const headMat = new THREE.MeshStandardMaterial({ color: 0xff1744, metalness: 0.7, roughness: 0.2 }); const head = new THREE.Mesh(headGeo, headMat); group.add(head);
                        const fMat = new THREE.MeshBasicMaterial({ color: 0xff4081, side: THREE.DoubleSide }); const featherGeo = new THREE.PlaneGeometry(0.4, 0.14); featherGeo.translate(0.25, 0.07, 0);
                        for (let i = 0; i < 3; i++) { const feather = new THREE.Mesh(featherGeo, fMat); feather.rotation.x = (i * Math.PI * 2) / 3; group.add(feather); }
                        return group;
                    }

                    const bowGroup = new THREE.Group(); const bowPivot = new THREE.Vector3(-4.5, -6.5, 0); bowGroup.position.copy(bowPivot); bowGroup.rotation.z = Math.PI / 4; scene.add(bowGroup);
                    const bowCurve = new THREE.CatmullRomCurve3([ new THREE.Vector3(-0.4, 2.8, 0), new THREE.Vector3(0.3, 1.8, 0), new THREE.Vector3(0.65, 0, 0), new THREE.Vector3(0.3, -1.8, 0), new THREE.Vector3(-0.4, -2.8, 0) ]);
                    const bowGeo = new THREE.TubeGeometry(bowCurve, 40, 0.08, 12, false); const bowMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.85 }); const bowMesh = new THREE.Mesh(bowGeo, bowMat); bowGroup.add(bowMesh);
                    const stringGeo = new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(-0.4, 2.8, 0), new THREE.Vector3(-0.4, 0, 0), new THREE.Vector3(-0.4, -2.8, 0) ]); const stringMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }); const bowString = new THREE.Line(stringGeo, stringMat); bowGroup.add(bowString);
                    const previewArrow = createArrowMesh(); previewArrow.position.set(-0.4, 0, 0); bowGroup.add(previewArrow);
                    const trajCount = 20; const trajPoints = []; for (let i = 0; i < trajCount; i++) trajPoints.push(new THREE.Vector3()); const trajGeo = new THREE.BufferGeometry().setFromPoints(trajPoints); const trajMat = new THREE.PointsMaterial({ color: 0xff69b4, size: 0.12, transparent: true, opacity: 0.75 }); const trajLine = new THREE.Points(trajGeo, trajMat); trajLine.visible = false; scene.add(trajLine);

                    function createTextTexture(text, color, glowColor) {
                        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128; const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.font = 'bold italic 48px \'Playfair Display\', serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.shadowColor = glowColor; ctx.shadowBlur = 18; ctx.fillStyle = color; ctx.fillText(text, 256, 64);
                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold italic 46px \'Playfair Display\', serif'; ctx.fillText(text, 256, 64);
                        return new THREE.CanvasTexture(canvas);
                    }
                    const textTextures = [ createTextTexture('❤ I LOVE YOU ❤', '#ff1493', '#ff007f'), createTextTexture('I LOVE YOU', '#ffd700', '#ff69b4'), createTextTexture('FOREVER ❤', '#ff2d55', '#ff4081'), createTextTexture('MY LOVE ✦', '#00f5d4', '#00bbf9') ];

                    let activeArrows = [], trailParticles = [], flyingTexts = [], miniHearts = [], heartStreamers = [], shockwaves = [];
                    const miniHeartGeo = createHeartGeometry(0.25); miniHeartGeo.center();
                    let heartScaleBounce = 1.0;
                    let hasTriggeredNextScene = false;

                    function triggerLoveExplosion(pos) {
                        const textCount = 14;
                        for (let i = 0; i < textCount; i++) {
                            const tex = textTextures[Math.floor(Math.random() * textTextures.length)];
                            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 1, blending: THREE.AdditiveBlending });
                            const sprite = new THREE.Sprite(mat); sprite.position.copy(pos); sprite.scale.set(3.2, 0.8, 1);
                            const angle = (i / textCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4; const speed = 3.5 + Math.random() * 6.0;
                            sprite.velocity = new THREE.Vector3(Math.cos(angle) * speed, Math.sin(angle) * speed + 2.0, (Math.random() - 0.5) * 4);
                            sprite.life = 1.0; sprite.rotSpeed = (Math.random() - 0.5) * 1.5; scene.add(sprite); flyingTexts.push(sprite);
                        }
                        const heartBurstCount = 35;
                        for (let i = 0; i < heartBurstCount; i++) {
                            const mMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.4 ? 0xff0055 : 0xff69b4, emissive: 0x440011, roughness: 0.2, metalness: 0.5 });
                            const mMesh = new THREE.Mesh(miniHeartGeo, mMat); mMesh.position.copy(pos);
                            const speed = 4 + Math.random() * 8; const theta = Math.random() * Math.PI * 2; const phi = Math.random() * Math.PI;
                            mMesh.velocity = new THREE.Vector3(speed * Math.sin(phi) * Math.cos(theta), speed * Math.sin(phi) * Math.sin(theta), speed * Math.cos(phi));
                            mMesh.rotSpeed = new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8); mMesh.life = 1.0; scene.add(mMesh); miniHearts.push(mMesh);
                        }
                        const streamerCount = 75;
                        for (let i = 0; i < streamerCount; i++) {
                            const streamer = new THREE.Mesh(miniHeartGeo, new THREE.MeshBasicMaterial({ color: Math.random() > 0.3 ? 0xff3366 : 0xffd700, transparent: true, opacity: 0.95 }));
                            streamer.position.set(pos.x + (Math.random() - 0.5) * 18, 12.5 + Math.random() * 5, pos.z + (Math.random() - 0.5) * 8); streamer.scale.set(0.6, 0.6, 0.6);
                            streamer.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.8, -(2.0 + Math.random() * 3.0), (Math.random() - 0.5) * 0.8);
                            streamer.swaySpeed = 2 + Math.random() * 3; streamer.swayOffset = Math.random() * Math.PI * 2; streamer.rotSpeed = new THREE.Vector3(Math.random() * 4, Math.random() * 4, Math.random() * 4);
                            scene.add(streamer); heartStreamers.push(streamer);
                        }
                        const shockGeo = new THREE.RingGeometry(0.2, 0.5, 36);
                        const shockMesh = new THREE.Mesh(shockGeo, new THREE.MeshBasicMaterial({ color: 0xff1493, side: THREE.DoubleSide, transparent: true, opacity: 1 })); shockMesh.position.copy(pos); scene.add(shockMesh);
                        shockwaves.push({ mesh: shockMesh, scale: 1, opacity: 1 });
                        heartScaleBounce = 1.6;

                        if (!hasTriggeredNextScene) {
                            hasTriggeredNextScene = true;
                            setTimeout(() => {
                                window.parent.postMessage('bow_hit', '*');
                            }, 2000); 
                        }
                    }

                    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2(); const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                    let isPulling = false; let dragStart = new THREE.Vector3(); let currentPull = 0; let pullAngle = 0; const maxPull = 2.4; const baseBowRotation = Math.PI / 4;

                    function getWorldPos(clientX, clientY) { mouse.x = (clientX / window.innerWidth) * 2 - 1; mouse.y = -(clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(mouse, camera); const hit = new THREE.Vector3(); raycaster.ray.intersectPlane(planeZ, hit); return hit; }
                    function handleStart(clientX, clientY) { isPulling = true; dragStart = getWorldPos(clientX, clientY); updateAim(clientX, clientY); }
                    function handleMove(clientX, clientY) { if (isPulling) updateAim(clientX, clientY); }
                    function handleEnd() { if (isPulling) { if (currentPull > 0.4) shootArrow(); else resetBow(); isPulling = false; trajLine.visible = false; } }
                    
                    window.addEventListener('mousedown', (e) => { if (e.button === 0) handleStart(e.clientX, e.clientY); });
                    window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
                    window.addEventListener('mouseup', (e) => { if (e.button === 0) handleEnd(); });
                    window.addEventListener('touchstart', (e) => { if (e.touches.length > 0) handleStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
                    window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
                    window.addEventListener('touchend', () => handleEnd());

                    function updateAim(clientX, clientY) {
                        const currentPos = getWorldPos(clientX, clientY); const dragDelta = new THREE.Vector3().subVectors(dragStart, currentPos);
                        currentPull = Math.min(Math.max(dragDelta.length(), 0), maxPull);
                        const rawAngle = Math.atan2(dragDelta.y, dragDelta.x);
                        let targetAngle = Math.max(0, Math.min(Math.PI / 2.5, rawAngle));
                        pullAngle = targetAngle; bowGroup.rotation.z = baseBowRotation + pullAngle;
                        const pullBackX = -0.4 - currentPull * 0.8; previewArrow.position.set(pullBackX, 0, 0);
                        const posAttr = bowString.geometry.attributes.position; posAttr.setXYZ(1, pullBackX, 0, 0); posAttr.needsUpdate = true;
                        trajLine.visible = true;
                        const shootDir = new THREE.Vector3(Math.cos(bowGroup.rotation.z), Math.sin(bowGroup.rotation.z), 0).normalize(); const launchSpeed = currentPull * 17.5;
                        const simPos = bowPivot.clone().add(new THREE.Vector3(0.5 * Math.cos(bowGroup.rotation.z), 0.5 * Math.sin(bowGroup.rotation.z), 0)); const simVel = shootDir.clone().multiplyScalar(launchSpeed);
                        const trajAttr = trajGeo.attributes.position;
                        for (let i = 0; i < trajCount; i++) { trajAttr.setXYZ(i, simPos.x, simPos.y, simPos.z); simPos.addScaledVector(simVel, 0.04); simVel.y -= 9.8 * 0.04 * 0.35; }
                        trajAttr.needsUpdate = true;
                    }
                    function resetBow() { previewArrow.position.set(-0.4, 0, 0); const posAttr = bowString.geometry.attributes.position; posAttr.setXYZ(1, -0.4, 0, 0); posAttr.needsUpdate = true; bowGroup.rotation.z = baseBowRotation; }
                    function shootArrow() {
                        const arrow = createArrowMesh(); arrow.position.copy(bowPivot);
                        const shootDir = new THREE.Vector3(Math.cos(bowGroup.rotation.z), Math.sin(bowGroup.rotation.z), 0).normalize(); const speed = currentPull * 18.0;
                        arrow.velocity = shootDir.clone().multiplyScalar(speed); arrow.gravity = 9.8 * 0.35;
                        arrow.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), shootDir);
                        scene.add(arrow); activeArrows.push(arrow); resetBow();
                    }

                    const clock = new THREE.Clock();
                    function animate() {
                        requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.1); const time = clock.getElapsedTime();
                        heart.rotation.y = time * 1.5; ring1.rotation.x = time * 1.2; ring1.rotation.y = time * 0.8; ring2.rotation.z = -time * 0.9; ring2.rotation.x = time * 0.6;
                        if (heartScaleBounce > 1.0) { heartScaleBounce -= dt * 2.2; if (heartScaleBounce < 1.0) heartScaleBounce = 1.0; }
                        heart.scale.set(heartScaleBounce, heartScaleBounce, heartScaleBounce);

                        for (let i = activeArrows.length - 1; i >= 0; i--) {
                            const arr = activeArrows[i]; arr.velocity.y -= arr.gravity * dt; arr.position.addScaledVector(arr.velocity, dt);
                            const dir = arr.velocity.clone().normalize(); arr.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir);
                            if (Math.random() > 0.3) {
                                const spark = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 4), new THREE.MeshBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 0.9 }));
                                spark.position.copy(arr.position); spark.life = 0.45; scene.add(spark); trailParticles.push(spark);
                            }
                            const tipPos = arr.position.clone().addScaledVector(dir, 2.9);
                            if (tipPos.distanceTo(heart.position) < 1.8) { triggerLoveExplosion(heart.position); scene.remove(arr); activeArrows.splice(i, 1); continue; }
                            if (arr.position.x > 22 || arr.position.y > 22 || arr.position.y < -22) { scene.remove(arr); activeArrows.splice(i, 1); }
                        }
                        for (let i = trailParticles.length - 1; i >= 0; i--) { const p = trailParticles[i]; p.life -= dt * 2.2; p.material.opacity = p.life; if (p.life <= 0) { scene.remove(p); trailParticles.splice(i, 1); } }
                        for (let i = flyingTexts.length - 1; i >= 0; i--) {
                            const t = flyingTexts[i]; t.position.addScaledVector(t.velocity, dt); t.velocity.y += 0.8 * dt; t.material.rotation += t.rotSpeed * dt; t.life -= dt * 0.45; t.material.opacity = Math.max(0, t.life); t.scale.multiplyScalar(1.0 + dt * 0.2);
                            if (t.life <= 0) { scene.remove(t); flyingTexts.splice(i, 1); }
                        }
                        for (let i = miniHearts.length - 1; i >= 0; i--) {
                            const h = miniHearts[i]; h.velocity.y -= 9.8 * 0.35 * dt; h.position.addScaledVector(h.velocity, dt); h.rotation.x += h.rotSpeed.x * dt; h.rotation.y += h.rotSpeed.y * dt; h.life -= dt * 0.55; h.scale.multiplyScalar(0.98);
                            if (h.life <= 0) { scene.remove(h); miniHearts.splice(i, 1); }
                        }
                        for (let i = heartStreamers.length - 1; i >= 0; i--) {
                            const s = heartStreamers[i]; s.position.addScaledVector(s.velocity, dt); s.position.x += Math.sin(time * s.swaySpeed + s.swayOffset) * 0.04; s.rotation.x += s.rotSpeed.x * dt; s.rotation.y += s.rotSpeed.y * dt; s.rotation.z += s.rotSpeed.z * dt;
                            if (s.position.y < -12) { scene.remove(s); heartStreamers.splice(i, 1); }
                        }
                        for (let i = shockwaves.length - 1; i >= 0; i--) {
                            const sw = shockwaves[i]; sw.scale += dt * 12; sw.mesh.scale.set(sw.scale, sw.scale, 1); sw.opacity -= dt * 2.2; sw.mesh.material.opacity = Math.max(0, sw.opacity);
                            if (sw.opacity <= 0) { scene.remove(sw.mesh); shockwaves.splice(i, 1); }
                        }
                        renderer.render(scene, camera);
                    }
                    animate();
                    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
                </script>
            </body>
            </html>
        "></iframe>
    </div>

    <!-- MÀN 2: Trái tim I LOVE YOU & Ảnh -->
    <div id="scene2" class="scene">
        <iframe id="iframe-heart" class="scene-iframe" srcdoc='
            <!DOCTYPE html>
            <html lang="vi">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
              html,body{margin:0; padding:0; background:#03030c; overflow:hidden; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center;}
              canvas{display:block; max-width:100vw; max-height:100vh; width:auto; height:auto; object-fit:contain;}
            </style>
            </head>
            <body>

                </style>
              </head>
              <body>
                <div class="glow g1"></div>
                <div class="glow g2"></div>
                <div id="stage">

                <div id="slideshow">
                  <img class="slide-img" id="img1" src="https://raw.githubusercontent.com/hhhh22022010-ops/Tdung/main/IMG_20261019_185914.jpg" alt="Hoa 1">
                  <img class="slide-img" id="img2" src="https://raw.githubusercontent.com/hhhh22022010-ops/Tdung/main/IMG_20261019_185840.jpg" alt="Hoa 2">
                  <img class="slide-img" id="img3" src="https://raw.githubusercontent.com/hhhh22022010-ops/Tdung/main/IMG_20261019_185935.jpg" alt="Hoa 3">
                </div>
                <div id="final-message">
                  <div id="text-1">Và điều cuối anh muốn nói là...</div>
                  <div id="text-2">Anh yêu em, cả hiện tại, sau này và mãi mãi</div>
                </div>
                <script>
                  const CFG = { l1: "CHÚC MỪNG 20/10", l2: "Bình An", name: "Bình An", intro: "20/10 năm nay a chúc bé iu của anh có 1 ngày vuiii vẻe ngày càng xinh đẹp và hạnh phúc .Anh mong rằng anh sẽ luôn là người khiến em mỉm cười hằng ngày. Và a cũng cảm ơn e đã đến bên a giúp a ngoan hơn với biết yêu người khác hơn. Cuối cùng a chúc bé có ngày phụ nữ thật vui vẽ và được ở bên cạch người e yêu", wishes: [ ["🌸", "Luôn xinh đẹp", "Trong mắt anh, em luôn là bông hoa rực rỡ nhất."], ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."], ["✨", "Bình yên", "Cùng anh tạo nên thật nhiều kỷ niệm ngọt ngào."], ["🌹", "Được yêu thương", "Để anh dành trọn trái tim này chăm sóc cho em."] ], quote: "Cảm ơn em vì đã chọn ở bên anh và làm cho cuộc sống của anh trở nên ngập tràn màu hồng.", sign: "— Chàng trai của riêng em 🌹" };
                  const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789"; const rnd = (a) => Array.isArray(a) || typeof a === "string" ? a[Math.floor(Math.random() * a.length)] : 0; const R = (a, b) => Math.random() * (b - a) + a; const $ = (id) => document.getElementById(id);
                  for (let i = 0; i < 60; i++) { const s = document.createElement("div"); s.className = "star"; s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`; document.body.appendChild(s); }
                  $("name").textContent = CFG.name; $("sign").textContent = CFG.sign; $("quote").textContent = CFG.quote;
                  $("wishes").innerHTML = CFG.wishes.map((w) => `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`).join("");
                  const flyers = []; let W = innerWidth, H = innerHeight, decoding = false, landed = 0, total = 0;
                  function build(el, text, cls) { [...text].forEach((c) => { const s = document.createElement("span"); s.className = "slot" + (c === " " ? " sp" : ""); s.textContent = c === " " ? "\u00a0" : c; el.appendChild(s); if (c !== " ") flyers.push({ slot: s, c, cls, real: true }); }); }
                  build($("l1"), CFG.l1, "l1"); build($("l2"), CFG.l2, "l2"); total = flyers.length;
                  function init() { flyers.forEach((f) => mk(f, parseFloat(getComputedStyle(f.slot).fontSize))); for (let i = 0; i < 34; i++) { const f = { real: false, c: "", cls: "" }; flyers.push(f); mk(f, R(18, 56)); } requestAnimationFrame(tick); }
                  function mk(f, size) { const e = document.createElement("div"); e.className = "fly"; e.style.fontSize = size + "px"; e.style.opacity = f.real ? 1 : 0.55; e.style.color = rnd(["#ffb3d4", "#ff6fae", "#ffd9a8", "#e0b3ff", "#fff"]); e.textContent = rnd(POOL); document.body.appendChild(e); Object.assign(f, { el: e, x: R(0, W), y: R(0, H), vx: R(-2.6, 2.6), vy: R(-2.6, 2.6), rot: R(0, 360), vr: R(-4, 4), t: R(0, 6), sc: 1, state: "fly" }); }
                  function tick() { flyers.forEach((f) => { if (f.state === "done" || !f.el) return; if (f.state === "fly") { f.vx += R(-0.12, 0.12); f.vy += R(-0.12, 0.12); const m = Math.hypot(f.vx, f.vy), mx = 3.2; if (m > mx) { f.vx *= mx / m; f.vy *= mx / m; } f.x += f.vx; f.y += f.vy; f.rot += f.vr; f.t += 0.04; f.sc = 1 + Math.sin(f.t) * 0.35; if (f.x < 0 || f.x > W) f.vx *= -1; if (f.y < 0 || f.y > H) f.vy *= -1; f.x = Math.max(-10, Math.min(W + 10, f.x)); f.y = Math.max(-10, Math.min(H + 10, f.y)); } else { const k = 0.075; f.x += (f.tx - f.x) * k; f.y += (f.ty - f.y) * k; f.rot += (0 - f.rot) * k; f.sc += (1 - f.sc) * k; if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1) land(f); } f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`; }); requestAnimationFrame(tick); }
                  function land(f) { f.state = "done"; f.el.remove(); f.slot.classList.add("ok"); sparkle(f.slot); if (++landed === total) { $("hint").textContent = "Giải mã thành công 💖"; heartStorm(); setTimeout(showCard, 1800); } }
                  setInterval(() => flyers.forEach((f) => { if (f.el && f.state !== "done" && Math.random() < 0.4) f.el.textContent = rnd(POOL); }), 150);
                  function decode() { if (decoding) return; decoding = true; $("btn").style.display = "none"; $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨"; let i = 0; flyers.forEach((f) => { if (f.real) { setTimeout(() => { const r = f.slot.getBoundingClientRect(); f.tx = r.left + r.width / 2; f.ty = r.top + r.height / 2; f.rot = (((f.rot % 360) + 540) % 360) - 180; f.state = "go"; f.el.textContent = f.c; }, 600 + i++ * 160); } else { setTimeout(() => { f.el.style.opacity = 0; }, 500 + R(0, 1500)); setTimeout(() => { f.state = "done"; f.el.remove(); }, 2600); } }); }
                  $("btn").onclick = decode; $("stage").addEventListener("click", (e) => { if (e.target.id !== "btn") decode(); }); addEventListener("resize", () => { W = innerWidth; H = innerHeight; }); (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
                  function sparkle(el) { const r = el.getBoundingClientRect(); for (let i = 0; i < 4; i++) burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10); }
                  function burst(x, y, ch, size) { const b = document.createElement("div"); b.className = "burst"; b.textContent = ch; b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`; document.body.appendChild(b); setTimeout(() => b.remove(), 900); }
                  const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
                  function heart() { const h = document.createElement("div"); h.className = "heart"; h.textContent = rnd(HEARTS); const d = R(5, 11); h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`; document.body.appendChild(h); setTimeout(() => h.remove(), d * 1000); }
                  function heartStorm() { for (let i = 0; i < 40; i++) setTimeout(heart, i * 60); }
                  function showCard() { $("stage").classList.add("hide"); $("card").classList.add("show"); setInterval(heart, 280); heartStorm(); let i = 0; setTimeout(function type() { $("msg").textContent = CFG.intro.slice(0, ++i); if (i < CFG.intro.length) setTimeout(type, 40); else { document.querySelectorAll(".w").forEach((w, k) => setTimeout(() => w.classList.add("on"), k * 350)); setTimeout(() => $("quote").classList.add("on2"), 1700); setTimeout(() => $("sign").classList.add("on2"), 2500); setTimeout(() => ($("btns").style.opacity = 1), 3000); } }, 1200); }
                  $("btn-flower").addEventListener("click", () => { $("card").classList.remove("show"); setTimeout(() => { $("slideshow").classList.add("show"); runSlideshow(); }, 1000); });
                  function runSlideshow() { const images = [$("img1"), $("img2"), $("img3")]; let currentIndex = 0; function showNextImage() { if (currentIndex > 0) { images[currentIndex - 1].classList.remove("active"); } if (currentIndex < images.length) { images[currentIndex].classList.add("active"); currentIndex++; setTimeout(showNextImage, 2500); } else { setTimeout(showFinalMessage, 1000); } } setTimeout(showNextImage, 500); }
                  function showFinalMessage() { $("slideshow").classList.remove("show"); setTimeout(() => { $("final-message").classList.add("show"); setTimeout(() => { $("text-1").classList.add("text-hidden"); setTimeout(() => { $("text-2").classList.add("text-show"); heartStorm(); }, 1000); }, 3000); }, 1000); }
                  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); if (!decoding) decode(); else heartStorm(); } });
                  const cur = document.createElement("div"); cur.id = "cur"; cur.innerHTML = "<span>❤</span>"; document.body.appendChild(cur); let lt = 0;
                  addEventListener("pointermove", (e) => { cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`; cur.style.opacity = 1; const n = performance.now(); if (n - lt < 50) return; lt = n; const t = document.createElement("div"); t.className = "trail"; t.textContent = rnd(["❤", "💖", "💗", "💕"]); t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`; document.body.appendChild(t); setTimeout(() => t.remove(), 1100); });
                  document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
                  $("card").addEventListener("click", (e) => { if (e.target.tagName !== "BUTTON") { for (let i = 0; i < 6; i++) burst(e.clientX, e.clientY, rnd(HEARTS), 18); } });
                </script>
              </body>
            </html>
        '></iframe>
    </div>

    <script>
        // --- LOGIC ĐIỀU KHIỂN CHUYỂN CẢNH VÀ ÂM THANH ---
        const scenes = {
            1: document.getElementById('scene1'),
            2: document.getElementById('scene2'),
            3: document.getElementById('scene3'),
            4: document.getElementById('scene4'),
            5: document.getElementById('scene5')
        };
        const music1 = document.getElementById('music-1');
        const music2 = document.getElementById('music-2');
        const music3 = document.getElementById('music-3');
        const startOverlay = document.getElementById('start-overlay');

        function showScene(id) {
            Object.values(scenes).forEach(s => s.classList.remove('active'));
            if(scenes[id]) {
                scenes[id].classList.add('active');
            }
        }

        // 1. Bắt đầu
        document.getElementById('start-btn').addEventListener('click', () => {
            startOverlay.style.opacity = 0;
            setTimeout(() => startOverlay.style.display = 'none', 1000);
            
            music1.volume = 0.7;
            music1.play().catch(e => console.log("Trình duyệt chặn autoplay:", e));
            
            showScene(1);
        });

        function crossfadeMusic(oldAudio, newAudio) {
            let fadeOut = setInterval(() => {
                if (oldAudio.volume > 0.05) {
                    oldAudio.volume -= 0.05;
                } else {
                    clearInterval(fadeOut);
                    oldAudio.pause();
                }
            }, 100);

            newAudio.volume = 0;
            newAudio.play().catch(e => console.log(e));
            let fadeIn = setInterval(() => {
                if (newAudio.volume < 0.7) {
                    newAudio.volume += 0.05;
                } else {
                    clearInterval(fadeIn);
                }
            }, 100);
        }

        // 2. Lắng nghe tín hiệu
        window.addEventListener('message', (event) => {
            // Tín hiệu 1: Bắn trúng tim -> Sang cảnh 2
            if (event.data === 'bow_hit') {
                showScene(2); 
                
                // Đợi 7s chuyển sang chạy chữ
                setTimeout(() => {
                    showScene(3);
                    // Bật nhạc 2 lên ngay khi màn hình chữ hiện ra
                    crossfadeMusic(music1, music2);
                    
                    // Kích hoạt hiệu ứng chạy chữ
                    startTypingLyrics();
                }, 7000);
            }
        });

        // === LOGIC CHẠY CHỮ TRỰC TIẾP TRÊN DOM (LYRIC VIDEO) ===
        function startTypingLyrics() {
            const container = document.getElementById("lyric-container");
            container.innerHTML = ""; // Xóa nội dung cũ (nếu chạy lại)
            
            const lyrics = [
                "Anh đã cố đổi thay để mạnh mẽ hơn vì anh sợ cô đơn.",
                "Nói yêu má hồng, mắt cong, bờ môi mọng rất khó.",
                "Vì lo trong trái tim em đã có ai.",
                "Nhưng nếu yêu em là sai thì anh đây không cần đúng.",
                "Người yêu ơi... yêu mình anh được không?",
                "Từ giờ và sau này xua lạnh nơi đêm mùa đông.",
                "Là ngày ta sum vầy, con tim hao gầy...",
                "Tình yêu đong đầy...Hãy để anh chứng minh cho em thấy...",
                "Người yêu ơi, yêu thì có gì sai đâu có sai đâu!",
                "Không là em thì ai",
                "Để anh đưa em về, và tình yêu mãi mê",
                "Mặc kệ người ta cười chê, bởi vì tình yêu là thế",
                "Làm người yêu anh nhé bây bê"
            ];

            let currentIndex = 0;

            function showNextLine() {
                if (currentIndex < lyrics.length) {
                    // Xóa dòng cũ
                    container.innerHTML = "";
                    
                    // Tạo dòng mới
                    const div = document.createElement("div");
                    div.className = "lyric-line";
                    div.textContent = lyrics[currentIndex];
                    container.appendChild(div);
                    
                    // Kích hoạt hiệu ứng hiện lên
                    setTimeout(() => {
                        div.classList.add("active");
                    }, 50);
                    
                    // Sau 2.8s thì bắt đầu mờ dần
                    setTimeout(() => {
                        div.classList.remove("active");
                        div.classList.add("fade-out");
                    }, 2800);
                    
                    // Sau 4.5s (1.7s sau khi mờ) thì chuyển sang dòng tiếp theo
                    setTimeout(() => {
                        currentIndex++;
                        showNextLine();
                    }, 5000);

                } else {
                    // KHI CHẠY CHỮ XONG, CHUYỂN SANG CẢNH HOA HỒNG
                    setTimeout(() => {
                        showScene(4);
                        crossfadeMusic(music2, music3);
                        
                        // Đợi 5s sau chuyển sang cảnh thiệp 20/10
                        setTimeout(() => {
                            showScene(5);
                        }, 5000);

                    }, 1500); // Đợi 1.5s sau khi dòng cuối mờ hẳn
                }
            }

            // Bắt đầu chạy dòng đầu tiên sau 1s
            setTimeout(showNextLine, 1000);
        }
    </script>
